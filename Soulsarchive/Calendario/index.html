<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: url('fondo.png') no-repeat center center fixed;
            background-size: cover;
            color: blue;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        .gif-container {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        .gif-container img {
            width: 120px;
            height: auto;
        }
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border: 2px solid blue;
        }
        input[type="date"] {
            font-size: 16px;
            padding: 5px;
        }
        #message-container {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid blue;
            background: white;
            display: none;
        }
    </style>
</head>
<body>
    <div class="gif-container">
        <img src="Reloj.gif" alt="GIF animado">
    </div>
    <div class="container">
        <a href="https://soulsarchive.com">Salir</a>
        <h1>*************************</h1>
        <input type="date" id="calendar">
        <div id="message-container"></div>
        <br><br>
        <br> 2000-02-01 <br> 2000-03-02 <br> 2000-04-03
    </div>
    <script>

        document.getElementById("calendar").addEventListener("change", function() {
            const selectedDate = this.value;
            const messageContainer = document.getElementById("message-container");
            
            if (messages[selectedDate]) {
                messageContainer.textContent = messages[selectedDate];
                messageContainer.style.display = "block";
                
                if (selectedDate === "9999-01-01") {
                    setTimeout(() => {
                        window.open("34928440209560.png", "_blank");
                    }, 1000);
                }if (selectedDate === "2000-04-03") {
                    setTimeout(() => {
                        window.open("340434094.png", "_blank");
                    }, 1000);
                }if (selectedDate === "2001-09-11") {
                    setTimeout(() => {
                        window.open("Torres.jpg", "_blank");
                    }, 1000);
                }
            } else {
                messageContainer.textContent = "";
                messageContainer.style.display = "none";
            }
        });
    </script>
</body>
</html>
