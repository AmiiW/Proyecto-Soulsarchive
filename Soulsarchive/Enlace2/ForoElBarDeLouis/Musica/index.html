<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Soulsarchive Soundtrack</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="album-wrapper">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="album-card">

      <!-- PORTADA -->
      <div class="album-cover">
        <img src="PortadaDiscoSouls.png" alt="Album Cover">
      </div>

      <!-- TRACKLIST -->
      <div class="album-tracks">

        <div class="track">
          <span class="track-title">01 — Internet Cave</span>
          <audio controls src="InternetCave.mp3"></audio>
        </div>

        <div class="track">
          <span class="track-title">02 — Bar de Louis</span>
          <audio controls src="BarDeLouis.mp3"></audio>
        </div>

        <div class="track">
          <span class="track-title">03 — Creepy Ending</span>
          <audio controls src="CreepyEnding.mp3"></audio>
        </div>

      </div>

    </div>

    <!-- TEXTO -->
    <div class="album-text">
      <p>
        El proyecto de Soulsarchive ya tiene un aura sonoro a manos de mi gran hermano Ak1.
      </p>
      <p>Instagram: @xjoaco_ak1</p>
    </div>

    <!-- BOTÓN VOLVER -->
    <div class="back-container">
      <button onclick="history.back()">← volver</button>
    </div>

  </div>

</body>
</html>
