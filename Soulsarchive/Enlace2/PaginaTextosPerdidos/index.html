<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" href="Icono1.png" type="image/svg+xml">
		<link rel="apple-touch-icon" href="Icono1.png">
	<title>Enunciados perdidos en la magnitud del universo</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="site-root">
		<header class="topbar">
			<div class="title-wrap">
				<div class="avatar-wrap" aria-hidden="true">
					<img id="avatar" src="Icono1.png" alt="Avatar" />
					<div class="avatar-glow"></div>
				</div>
				<h1 class="site-title">Enunciados perdidos en la magnitud del universo</h1>
			</div>
		</header>

		<main class="content">
			<section class="panel">
				<p class="lead">Explora fragmentos, capturas y archivos perdidos.</p>
			</section>

			<section class="gallery-section" aria-label="Galería de archivos">
				<div id="gallery-grid" class="gallery-grid">
					<button class="gallery-card" type="button" data-src="T1.png" data-alt="Fragmento 1">
						<img src="T1.png" alt="Fragmento 1">
					</button>
					<button class="gallery-card" type="button" data-src="T2.png" data-alt="Fragmento 2">
						<img src="T2.png" alt="Fragmento 2">
					</button>
					<button class="gallery-card" type="button" data-src="T3.png" data-alt="Fragmento 3">
						<img src="T3.png" alt="Fragmento 3">
					</button>
					<button class="gallery-card" type="button" data-src="T4.png" data-alt="Fragmento 4">
						<img src="T4.png" alt="Fragmento 4">
					</button>
				</div>
			</section>
		</main>

		<div id="lightbox" class="lightbox" aria-hidden="true">
			<button class="lightbox-close" type="button" aria-label="Cerrar vista ampliada">×</button>
			<img id="lightbox-image" src="" alt="Vista ampliada" />
		</div>

		<!-- Floating characters layers -->
		<div id="floating-behind" class="floating-layer" aria-hidden="true"></div>
		<div id="floating-front" class="floating-layer" aria-hidden="true"></div>
	</div>

	<script src="script.js"></script>
</body>
</html>
