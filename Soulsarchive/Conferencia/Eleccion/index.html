<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La conferencia de paz - Elige tu asiento</title>
  <link rel="icon" href="../Logo3.PNG" type="image/png">
  <link rel="stylesheet" href="styles4.css">
</head>
<body>

     <button id="backButton">🠔</button> <!-- Botón con flecha siempre visible -->

    <audio id="miAudio" autoplay muted loop>
        <source src="../Yum.mp3" type="audio/mpeg">
        Tu navegador no soporta la reproducción de audio.
    </audio>
    
    <script>
        document.addEventListener("click", function() {
            const audio = document.getElementById("miAudio");
            if (audio.muted) {
                audio.muted = false; // Activar el audio al primer clic del usuario
            }
        });
    </script>
    
    <div class="container">
    <header>
      <h1>Elige tu asiento</h1><br>
    </header>
    <main>
      <div class="seat-container">
        <div class="row">
          <div class="seat" data-seat="1">
            <img src="../Asiento.png" alt="Asiento 1">
            <p>1</p>
          </div>
          <div class="seat" data-seat="2">
            <img src="../Asiento.png" alt="Asiento 2">
            <p>2</p>
          </div>
          <div class="seat" data-seat="3">
            <img src="../Asiento.png" alt="Asiento 3">
            <p>3</p>
          </div>
        </div>
        <div class="row">
          <div class="seat" data-seat="4">
            <img src="../Asiento.png" alt="Asiento 4">
            <p>4</p>
          </div>
          <div class="seat" data-seat="5">
            <img src="../Asiento.png" alt="Asiento 5">
            <p>5</p>
          </div>
        </div>
      </div>
      <br>
      <button id="accept-btn" style="display: none;">Aceptar</button>
    </main>
  </div>
  <script src="script2.js"></script>
  
  <div class="footer-text">
    © 2024 Soulsarchive.com. Todos los derechos reservados.
  </div>
</body>
</html>
