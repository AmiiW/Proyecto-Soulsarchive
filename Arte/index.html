    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galeria de arte de Soulsarchive." />
    <title>La galeria de Ami // Soulsarchive</title>
    <style>
      :root {
        --black: #000;
        --white: #f4f4f2;
        --muted: #8f8f8c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--black);
        color: var(--white);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .gallery-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 28px;
      }

      .gallery-title {
        margin: 0;
        font-family: "Courier New", monospace;
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .back-link {
        color: var(--muted);
        font: 0.7rem monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .back-link:hover,
      .back-link:focus-visible {
        color: var(--white);
      }

      .gallery {
        column-count: 4;
        column-gap: 0;
      }

      .art-button {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: #090909;
        cursor: zoom-in;
        break-inside: avoid;
      }

      .art-button img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: brightness(0.9);
        transition: filter 220ms ease, transform 220ms ease;
      }

      .art-button:hover img,
      .art-button:focus-visible img {
        filter: brightness(1.1);
        transform: scale(1.035);
      }

      .art-button:focus-visible {
        outline: 1px solid var(--white);
        outline-offset: -3px;
      }

      .empty-gallery {
        padding: 80px 28px;
        color: var(--muted);
        font: 0.8rem/1.6 monospace;
        text-align: center;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 30px;
        background: rgba(0, 0, 0, 0.94);
        cursor: zoom-out;
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .lightbox.open {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-image {
        max-width: min(94vw, 1400px);
        max-height: 90vh;
        object-fit: contain;
        cursor: default;
        transform: scale(0.96);
        transition: transform 220ms ease;
      }

      .lightbox.open .lightbox-image {
        transform: scale(1);
      }

      .lightbox-close {
        position: absolute;
        top: 16px;
        right: 22px;
        border: 0;
        background: transparent;
        color: var(--white);
        cursor: pointer;
        font: 2rem/1 monospace;
      }

      @media (max-width: 600px) {
        .gallery-header {
          padding: 18px 16px;
        }

        .gallery {
          column-count: 2;
        }

        .lightbox {
          padding: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

      const gallery = document.getElementById('gallery');
      const emptyGallery = document.getElementById('emptyGallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxClose = document.getElementById('lightboxClose');

      images.forEach((fileName) => {
        const button = document.createElement('button');
        const image = document.createElement('img');

        button.className = 'art-button';
        button.type = 'button';
        image.src = `./imagenes/${fileName}`;
        image.alt = `Obra de arte ${fileName}`;
        image.loading = 'lazy';
        button.appendChild(image);
        gallery.appendChild(button);

        button.addEventListener('click', () => {
          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;
          lightbox.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
      });

      emptyGallery.hidden = images.length > 0;

      const closeLightbox = () => {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      };

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox || event.target === lightboxClose) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeLightbox();
        }
