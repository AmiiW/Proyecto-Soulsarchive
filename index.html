<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Selecciona una experiencia de Soulsarchive." />
    <title>Soulsarchive</title>
    <link rel="icon" type="image/png" href="./LogoV2.png" />
    <style>
      @font-face {
        font-family: "NewGen Soulsarchive";
        src: url("./Pagina%20Tipografia/NewgenSoulsarchive-Regular.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --night: #030405;
        --panel: rgba(14, 16, 18, 0.82);
        --line: rgba(255, 255, 255, 0.22);
        --soft-line: rgba(255, 255, 255, 0.1);
        --white: #f5f6f2;
        --muted: #aeb2b0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.055), transparent 34%),
          linear-gradient(120deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(30deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px),
          var(--night);
        background-size: auto, 72px 72px, 96px 96px, auto;
        color: var(--white);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        content: "";
        opacity: 0.16;
        background: repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.05) 4px,
          transparent 5px
        );
      }

      .entry {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 52px 22px 44px;
      }

      .entry-inner {
        width: min(100%, 940px);
        text-align: center;
      }

      .kicker {
        margin: 0 0 20px;
        color: var(--muted);
        font: 0.66rem/1.4 monospace;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      h1 {
        position: relative;
        display: inline-block;
        max-width: 100%;
        margin: 0 0 54px;
        color: var(--white);
        font-family: "NewGen Soulsarchive", "Courier New", monospace;
        font-size: clamp(2.2rem, 6.4vw, 5.1rem);
        font-weight: 400;
        letter-spacing: 0.1em;
        line-height: 0.95;
        overflow-wrap: anywhere;
        text-transform: uppercase;
        text-shadow: 2px 0 rgba(255, 45, 45, 0.6), -2px 0 rgba(45, 188, 255, 0.55);
      }

      h1::before,
      h1::after {
        position: absolute;
        inset: 0;
        overflow: hidden;
        color: var(--white);
        content: attr(data-text);
        pointer-events: none;
      }

      h1::before {
        left: 2px;
        clip-path: inset(45% 0 38% 0);
        color: rgba(255, 50, 50, 0.8);
        transform: translateX(-2px);
      }

      h1::after {
        left: -2px;
        clip-path: inset(15% 0 70% 0);
        color: rgba(60, 190, 255, 0.8);
        transform: translateX(2px);
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(18px, 4vw, 38px);
        align-items: start;
      }

      .choice {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: stretch;
        color: inherit;
        text-align: left;
        text-decoration: none;
      }

      .choice-panel {
        position: relative;
        display: grid;
        aspect-ratio: 1.48 / 1;
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 255, 255, 0.025);
        transition: border-color 300ms ease, box-shadow 300ms ease, transform 300ms ease;
      }

      .choice-panel::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 34px rgba(255, 255, 255, 0.02);
        content: "";
        pointer-events: none;
        transition: box-shadow 300ms ease;
      }

      .choice-image {
        width: 72%;
        height: 70%;
        object-fit: contain;
        filter: grayscale(0.35) contrast(1.08) brightness(0.82);
        transition: filter 300ms ease, transform 300ms ease;
      }

      .choice-label {
        position: absolute;
        right: 18px;
        bottom: 14px;
        color: rgba(255, 255, 255, 0.6);
        font: 0.62rem monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .choice-description {
        max-height: 0;
        margin: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.6;
        opacity: 0;
        transform: translateY(-12px);
        transition: max-height 360ms ease, opacity 300ms ease, transform 360ms ease, margin 360ms ease;
      }

      .choice-description::before {
        display: block;
        width: 34px;
        height: 1px;
        margin-bottom: 12px;
        background: var(--white);
        content: "";
      }

      .choice:hover .choice-panel,
      .choice:focus-visible .choice-panel {
        border-color: rgba(255, 255, 255, 0.72);
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.12), 0 24px 54px rgba(0, 0, 0, 0.48), inset 0 0 28px rgba(255, 255, 255, 0.06);
        transform: translateY(-5px);
      }

      .choice:hover .choice-panel::after,
      .choice:focus-visible .choice-panel::after {
        box-shadow: inset 0 0 45px rgba(255, 255, 255, 0.11);
      }

      .choice:hover .choice-image,
      .choice:focus-visible .choice-image {
        filter: grayscale(0) contrast(1.08) brightness(1.08);
        transform: scale(1.04);
      }

      .choice:hover .choice-description,
      .choice:focus-visible .choice-description {
        max-height: 130px;
        margin: 20px 8px 0;
        opacity: 1;
        transform: translateY(0);
      }

      .choice:focus-visible {
        outline: 1px solid rgba(255, 255, 255, 0.8);
        outline-offset: 9px;
      }

      @media (max-width: 650px) {
        .entry {
          padding: 32px 12px 28px;
        }

        .kicker {
          margin-bottom: 16px;
          font-size: 0.58rem;
          letter-spacing: 0.2em;
          overflow-wrap: anywhere;
        }

        h1 {
          margin-bottom: 36px;
          font-size: clamp(1.65rem, 9vw, 3rem);
          letter-spacing: 0.06em;
        }

        .choices {
          grid-template-columns: 1fr;
          gap: 24px;
        }

        .choice-panel {
          aspect-ratio: 1.7 / 1;
        }

        .choice-label {
          right: 12px;
          bottom: 10px;
          font-size: 0.56rem;
        }

        .choice-description {
          padding: 0 4px;
          font-size: 0.84rem;
        }

        .choice-description {
          max-height: none;
          margin: 15px 8px 0;
          opacity: 1;
          transform: none;
        }
      }

      @media (min-width: 651px) and (max-width: 900px) {
        .choices {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="entry">
      <div class="entry-inner">
        <p class="kicker">Proyecto creativo</p>
        <h1 data-text="Soulsarchive">Soulsarchive</h1>

        <section class="choices" aria-label="Destinos principales">
          <!-- Edita data-description para cambiar la descripcion de esta tarjeta. -->
          <a
            class="choice"
            href="./Pagina%20Tipografia/index.html"
            data-description="Tipografia del proyecto, con el diseño caracteristico de Soulsarchive"
          >
            <span class="choice-panel">
              <img class="choice-image" src="./Pagina%20Tipografia/GranImagen1.png" alt="Muestra de la tipografia NewGen Soulsarchive" />
              <span class="choice-label">01 / Tipografia</span>
            </span>
            <span class="choice-description"></span>
          </a>

          <!-- Edita data-description para cambiar la descripcion de esta tarjeta. -->
          <a
            class="choice"
            href="./Soulsarchive/index.html"
            data-description="El proyecto web de Soulsarchive, donde las almas del campo de setas se comunican con los seres humanos"
          >
            <span class="choice-panel">
              <img class="choice-image" src="./Soulsarchive/wordart.png" alt="Logo de Soulsarchive" />
              <span class="choice-label">02 / SocialMedia</span>
            </span>
            <span class="choice-description"></span>
          </a>

          <!-- Edita data-description para cambiar la descripcion de esta tarjeta. -->
          <a
            class="choice"
            href="./Arte/index.html"
            data-description="Mi galeria de arte."
          >
            <span class="choice-panel">
              <img class="choice-image" src="./LogoV2.png" alt="Icono de la galeria de arte" />
              <span class="choice-label">03 / La galeria de Ami</span>
            </span>
            <span class="choice-description"></span>
          </a>
        </section>
      </div>
    </main>

    <script>
      document.querySelectorAll('.choice').forEach((choice) => {
        choice.querySelector('.choice-description').textContent = choice.dataset.description;
      });
    </script>
  </body>
</html>
